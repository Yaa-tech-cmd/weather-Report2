<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Info Finder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #0078d7;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        #result {
            margin-top: 20px;
        }

        .country-card {
            text-align: center;
        }

        .country-card img {
            width: 120px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .loading {
            color: #0078d7;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .info {
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Country Info Finder</h1>

    <div class="search-box">
        <input
            type="text"
            id="countryInput"
            placeholder="Enter country name"
        />
        <button id="searchBtn">Search</button>
    </div>

    <div id="result"></div>
</div>

<script>
    const searchBtn = document.getElementById("searchBtn");
    const countryInput = document.getElementById("countryInput");
    const result = document.getElementById("result");

    async function getCountry() {
        const country = countryInput.value.trim();

        if (!country) {
            result.innerHTML =
                '<p class="error">Please enter a country name.</p>';
            return;
        }

        result.innerHTML =
            '<p class="loading">Loading...</p>';

        try {
            const response = await fetch(
                `https://restcountries.com/v3.1/name/${country}?fullText=true`
            );

            if (!response.ok) {
                throw new Error("Country not found.");
            }

            const data = await response.json();
            const countryData = data[0];

            result.innerHTML = `
                <div class="country-card">
                    <img src="${countryData.flags.png}" alt="Flag">
                    <h2>${countryData.name.common}</h2>
                    <p class="info">
                        <strong>Capital:</strong>
                        ${countryData.capital?.[0] || "N/A"}
                    </p>
                    <p class="info">
                        <strong>Population:</strong>
                        ${countryData.population.toLocaleString()}
                    </p>
                    <p class="info">
                        <strong>Region:</strong>
                        ${countryData.region}
                    </p>
                    <p class="info">
                        <strong>Currency:</strong>
                        ${
                            Object.values(countryData.currencies || {})[0]
                                ?.name || "N/A"
                        }
                    </p>
                </div>
            `;
        } catch (error) {
            result.innerHTML = `
                <p class="error">
                    Error: ${error.message}
                </p>
            `;
        }
    }

    searchBtn.addEventListener("click", getCountry);

    countryInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            getCountry();
        }
    });
</script>

</body>
</html>
